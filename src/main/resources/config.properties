# SahanaMart Application Configuration
# Anna University R2025 Semester 3 Capstone

# Server Configuration
server.port=8080
server.contextPath=

# Database Configuration (H2 File-based Persistent Mode)
# Switch to mysql by updating driver and url if desired
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/sahanamart;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
db.username=sa
db.password=

# HikariCP Pool Configuration
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1800000

# Security
session.timeoutMinutes=30

# AI Chatbot Configuration
# Options: mock | gemini
ai.chatbot.provider=mock
ai.chatbot.rateLimitPerMinute=10
ai.chatbot.maxInputLength=250
ai.chatbot.geminiApiKey=
ai.chatbot.geminiModel=gemini-1.5-flash
