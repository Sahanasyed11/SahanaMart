name: SahanaMart CI Build & Test Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify Java Servlets Web Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Run Unit & DAO Tests
      run: mvn -B clean verify

    - name: Package WAR Artifact
      run: mvn -B package -DskipTests

    - name: Archive Deployable WAR
      uses: actions/upload-artifact@v4
      with:
        name: sahanamart-war
        path: target/sahanamart.war
